name: Build and deploy container app to Azure Web App - document-analyzer

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/balaji268268/document-analyzer:latest
          file: ./Dockerfile

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'document-analyzer'
          images: 'ghcr.io/balaji268268/document-analyzer:latest'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D54E27C6A257418883FF3A874D45C0FD }}