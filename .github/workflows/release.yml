name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build for (e.g. v2.0.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: linux-x64
            artifact_dir: dist/DocSummarizer
            zip_name: DocSummarizer-linux-x64.zip
          - os: windows-latest
            os_label: windows-x64
            artifact_dir: dist/DocSummarizer
            zip_name: DocSummarizer-windows-x64.zip

    steps:
      - name: Resolve and validate tag
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]; then
            echo "Refusing to build: tag '$TAG_INPUT' does not look like vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install package + runtime + gui + PyInstaller
        run: pip install -e ".[runtime,gui]" pyinstaller

      - name: Build executable package
        run: pyinstaller --noconfirm --onedir --windowed --name "DocSummarizer" --paths "src" run.py

      - name: Compress release artifact (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist\DocSummarizer -DestinationPath ${{ matrix.zip_name }}

      - name: Compress release artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          zip -r ${{ matrix.zip_name }} dist/DocSummarizer

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" --title "Release $TAG" --notes "Automated release $TAG" 2>/dev/null || true
          gh release upload "$TAG" "${{ matrix.zip_name }}" --clobber
